name: Regeltests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/rules.test.js
      - run: for f in config.js data.js engine.js app.js features.js sw.js; do node --check "$f"; done
